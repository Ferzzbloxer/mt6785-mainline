name: Build rosemary kernel

on:
  workflow_dispatch:
  push:
    branches: [rosemary]

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves cpio lz4 zstd u-boot-tools device-tree-compiler ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure
        run: |
          export PATH=/usr/lib/ccache:$PATH
          make O=out defconfig rosemary.config
          # optional: extra options needed for postmarketOS
          # scripts/config --file out/.config -e DEVTMPFS -e CGROUPS

      - name: Build
        run: |
          export PATH=/usr/lib/ccache:$PATH
          make O=out -j$(nproc) Image.gz dtbs modules
          make O=out INSTALL_MOD_PATH=$PWD/modules_install modules_install

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz dist/
          cp out/arch/arm64/boot/dts/mediatek/mt6785-xiaomi-rosemary.dtb dist/
          cp out/.config dist/config
          cat dist/Image.gz dist/mt6785-xiaomi-rosemary.dtb > dist/Image.gz-dtb
          tar -C modules_install -czf dist/modules.tar.gz .
          make O=out -s kernelrelease > dist/kernelrelease.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rosemary-kernel
          path: dist/